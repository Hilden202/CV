name: Generate PDF CV
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'script/**'
      - 'images/**'
      - 'txt/**'
      - '.github/workflows/generate-cv-pdf.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Puppeteer
        run: npm install --no-save puppeteer
      - name: Generate PDF from checked-out source
        run: node script/generate-pdf.cjs
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify PDF page format
        run: |
          pdfinfo pdf/Patrik_Hildenborg_CV.pdf | tee pdf-info.txt
          grep -Eq 'Page size:.*(594\\.9[0-9]|595(\\.0[0-9])?) x (841\\.9[0-9]|842(\\.0[0-9])?) pts \\(A4\\)' pdf-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CV-PDF
          path: pdf/Patrik_Hildenborg_CV.pdf
          if-no-files-found: error

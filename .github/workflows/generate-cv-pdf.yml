name: Generate PDF CV
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'script/**'
      - 'images/**'
      - 'txt/**'
      - '.github/workflows/generate-cv-pdf.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Puppeteer
        run: npm install --no-save puppeteer
      - name: Generate PDF from checked-out source
        run: node script/generate-pdf.cjs
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify PDF page format
        run: |
          pdfinfo pdf/Patrik_Hildenborg_CV.pdf | tee pdf-info.txt
          python3 -c "import re; s=open('pdf-info.txt').read(); m=re.search(r'Page size:\\s*([0-9.]+) x ([0-9.]+) pts',s); assert m and abs(float(m[1])-595)<1 and abs(float(m[2])-842)<1, 'PDF is not A4'"
      - uses: actions/upload-artifact@v4
        with:
          name: CV-PDF
          path: pdf/Patrik_Hildenborg_CV.pdf
          if-no-files-found: error
